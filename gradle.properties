pluginGroup = dev.llmlint.springai
pluginName = LintBeam for Spring AI
pluginVersion = 0.1.0

# Supported IDE range: 2025.1 (251) .. 2026.3 (263.*)
pluginSinceBuild = 251
pluginUntilBuild = 263.*

# Compile and test against the lowest supported version, so we never use newer APIs by accident.
platformVersion = 2025.1.7

# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

# https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache = true

# https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching = true

org.gradle.jvmargs = -Xmx2g
