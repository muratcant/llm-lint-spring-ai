inspection.group.name=LLM Lint (Spring AI)
inspection.missing.output.limit.display.name=ChatClient call without an output token limit
inspection.unbounded.memory.display.name=Unbounded chat memory
inspection.unbounded.memory.window.message=Chat memory window of {0} messages: every call re-sends almost the whole conversation. Keep maxMessages small (default 20)
inspection.unbounded.memory.session.message=Session memory without a window: every call re-sends the whole session history. Add eventFilter(EventFilter.lastN(...)) or compaction(...)
inspection.unbounded.memory.option.threshold=Report maxMessages at or above:
inspection.missing.output.limit.option.report.provider.defaults=Also report calls that rely on the default output limit of the provider
inspection.missing.output.limit.provider.default.message=This call relies on the {0} default output limit ({1} tokens). Is that what you need?
inspection.missing.output.limit.partial.message=Not every path of this ChatClient call sets an output token limit (a branch or an alternative value has no maxTokens)
inspection.missing.output.limit.replaced.defaults.message=The .options(...) of this request replace the defaultOptions of the ChatClient, so their maxTokens is not applied. Set maxTokens in these request options too
inspection.missing.output.limit.message=No output token limit for this ChatClient call. Set maxTokens via .options(...), ChatClient.Builder.defaultOptions(...) or spring.ai.*.chat.options.max-tokens
