name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # Maven Central answers 429 (Too Many Requests) to busy runner IPs. Gradle 9.9 retries 429 and 5xx
      # responses, by default 3 times with 1 s, 2 s waits; wait longer here: 5, 10, 20, 40, 80 s.
      # These are Gradle-internal properties (ErrorHandlingModuleComponentRepository); CI only.
      - name: Retry dependency downloads on rate limits
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF'
          systemProp.org.gradle.internal.repository.max.tentatives=6
          systemProp.org.gradle.internal.repository.initial.backoff=5000
          EOF

      - name: Run tests
        run: ./gradlew --console=plain test

      - name: Build plugin
        run: ./gradlew --console=plain buildPlugin

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/tests/test
          if-no-files-found: ignore
